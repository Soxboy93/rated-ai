# Usage: copy .env.example to .env, fill it in, then `docker compose up -d --build`.
services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: rated_ai
      MARIADB_USER: rated
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

  migrate:
    build: .
    command: ["npx", "drizzle-kit", "migrate"]
    environment:
      DATABASE_URL: mysql://rated:${DB_PASSWORD}@db:3306/rated_ai
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: mysql://rated:${DB_PASSWORD}@db:3306/rated_ai
      NODE_ENV: production
      PORT: "3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on:
      - app

volumes:
  dbdata:
  caddydata:
